<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Curso de Programación</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS propio -->
    <link rel="stylesheet" href="style.css">

</head>


<body>

    <main class="container">

        <div class="row justify-content-center">

            <div class="col-12 col-md-8 col-lg-5">

                <!-- BLOCK -->
                <article class="course-card">

                    <!-- ELEMENT -->
                    <img
                        class="course-card__image"
                        src="maxresdefault.jpg"
                        alt="Programación en computador"
                    >


                    <!-- ELEMENT -->
                    <div class="course-card__content">

                        <!-- ELEMENT + MODIFIER -->
                        <span class="course-card__level course-card__level--basic">
                            IMPLANTE
                        </span>


                        <!-- ELEMENT -->
                        <h1 class="course-card__title">
                            Curso de Programación
                        </h1>


                        <!-- ELEMENT -->
                        <p class="course-card__description">
                            Aprende los fturos implantes
                            desde cero. Conoce precios, beneficios
                            Utilidades, lugares, soluciones y mas
                        </p>


                        <!-- ELEMENT -->
                        <a href="#" class="course-card__button">
                            Ver mas
                        </a>

                    </div>

                </article>

            </div>

        </div>

    </main>


</body>

</html>
